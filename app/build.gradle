plugins {
    id 'com.android.application'
}

android {
    namespace 'com.airdeck.hid'
    compileSdk 35

    defaultConfig {
        applicationId 'com.airdeck.hid'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName '1.3.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
